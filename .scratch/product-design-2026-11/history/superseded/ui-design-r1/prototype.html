function campaign(){let body='';if(tab==='brief'){body=`<div class="panel"><h2>${t('brief')}</h2><label for="briefTitle">${bi('Campaign name','캠페인 이름')}</label><input id="briefTitle" value="${esc(briefDraft?.title||t('spring'))}"><div class="columns"><div><label for="brand">${bi('Brand / product family','브랜드 / 제품군')}</label><input id="brand" value="Haneul / Air cushion"><label for="market">${bi('Target market','목표 시장')}</label><select id="market"><option value="JP">Japan / 일본</option><option value="KR">Korea / 한국</option></select></div><div><label for="objective">${bi('Objective','목표')}</label><input id="objective" value="${bi('Consideration for a spring launch','봄 출시 제품 관심도')} "><label for="platform">${bi('Platforms','플랫폼')}</label><select id="platform"><option value="tiktok-instagram">TikTok, Instagram</option><option value="tiktok">TikTok</option></select></div></div><label for="criteria">${bi('Your selection needs','직접 입력한 선정 기준')}</label><textarea id="criteria">${esc(briefDraft?.criteria||bi('Require source-backed Japanese beauty content. Prefer recent cushion reviews. Exclude observed competitor exclusivity. Keep missing fees and audience geography as unknown.','출처가 있는 일본어 뷰티 콘텐츠 필수. 최근 쿠션 리뷰 선호. 관측된 경쟁사 독점 관계 제외. 비용과 시청자 위치가 없으면 알 수 없음으로 유지.'))}</textarea><label for="interpretation">${bi('Executable interpretation','실행할 기준 해석')}</label><select id="interpretation"><option value="criteria-v2">${bi('criteria-v2 · model suggestion plus original human constraints','criteria-v2 · 모델 제안 및 원래 사용자 제약')}</option><option value="human">${bi('Human criteria only','사용자 기준만 사용')}</option></select><details open><summary>${bi('Review how your criteria are applied','기준 적용 방식 검토')}</summary><ul><li>${bi('Requirement: permitted source support for the account. Incomplete profiles remain eligible.','필수: 계정에 허용된 출처 근거. 불완전한 프로필도 후보 가능.')}</li><li>${bi('Preference: recent product-category evidence. Missing evidence stays unknown.','선호: 최근 제품군 근거. 없는 근거는 알 수 없음으로 유지.')}</li><li>${bi('Model additions cannot weaken your requirements or exclusions.','모델이 추가한 기준은 사용자 필수 조건이나 제외 조건을 완화하지 못합니다.')}</li></ul></details>${btn(t('saveBrief'),'saveBrief',true)}</div>`;}else if(tab==='history'){body=`<h2>${t('history')}</h2><div class="timeline">${Array.from({length:revision},(_,i)=>revision-i).map(v=>`<article><h3>${bi('Shortlist revision','후보 목록 버전')} ${v}</h3><p>${revisionRecords.find(r=>r.v===v)?.author==='Mina'?bi('Human curation · Mina','사용자 편집 · Mina'):bi('Automation · saved recommendation','자동화 · 저장된 추천')} · brief-v${revisionRecords.find(r=>r.v===v)?.brief}</p><p>${bi('Pinned evidence and ranking method remain fixed. Current source policy still applies.','근거와 순위 산정 방법은 고정됩니다. 현재 출처 정책은 계속 적용됩니다.')}</p>${btn(bi('Inspect this revision','이 버전 검토'),`revision:${v}`)}</article>`).join('')}</div>`;}else if(revision===0){body=`<div class="panel"><h2>${bi('No saved shortlist yet','저장된 후보 목록 없음')}</h2><p>${bi('Complete the brief, then assess current permitted knowledge. The resulting recommendation is saved automatically.','브리프를 완성한 후 현재 허용된 지식을 평가하세요. 추천 결과는 자동 저장됩니다.')}</p>${btn(bi('Generate recommendation','추천 생성'),'initialRecommendation',true)}</div>`;}else{body=`<div class="row"><h2 style="margin:0">${bi('Recommended accounts','추천 계정')}</h2><span class="status">${curated?bi('Human curated','사용자 편집'):t('autoSaved')} · v${revision}</span></div><p class="muted">${curated?bi('Human curation by Mina. Original automated revisions remain in history.','Mina의 사용자 편집. 원래 자동 추천은 이력에 유지됩니다.'):bi('Automated recommendation. Human review is optional. No creator has been contacted.','자동 추천입니다. 사용자 검토는 선택 사항입니다. 크리에이터에게 연락하지 않았습니다.')}</p><div class="metric-strip"><div><strong>${curated?curatedAccounts.length:3}</strong>${bi('eligible accounts','선정 가능한 계정')}</div><div><strong>${curated?'—':'2 / 3'}</strong>${bi('with recent support','최근 근거 보유')}</div><div><strong>${bi('Limited','제한적')}</strong>${bi('campaign coverage','캠페인 커버리지')}</div></div><div class="table-scroll"><table><thead><tr><th>${bi('Rank','순위')}</th><th>${bi('Account / evidence','계정 / 근거')}</th><th>${bi('Fit and gaps','적합도 및 공백')}</th><th>${bi('Review','검토')}</th></tr></thead><tbody>${[['01','@mio.beauty','TikTok · Japan-language captions',bi('Cushion review supported; audience location unknown','쿠션 리뷰 근거 있음. 시청자 위치 미상')],['02','@sora.skin','Instagram · native account 202',bi('Category match; fee and availability unknown','제품군 일치. 비용과 참여 가능 여부 미상')],['03','TikTok account 303',bi('Profile incomplete · observed post author','프로필 불완전 · 관측된 게시물 작성자'),bi('Source-backed identity remains eligible; capture stale','출처 기반 계정으로 선정 가능. 수집 근거 오래됨')]].filter(r=>!curated||curatedAccounts.includes(r[1])).map(r=>`<tr><td><span class="rank">${r[0]}</span></td><td><strong>${r[1]}</strong><br><small>${r[2]}</small></td><td>${r[3]}</td><td>${btn(t('viewEvidence'),'candidate:'+r[1])}</td></tr>`).join('')}</tbody></table></div><div class="notice"><strong>${bi('The shortlist is saved. Discovery can improve coverage.','후보 목록이 저장되었습니다. 탐색으로 근거 범위를 보완할 수 있습니다.')}</strong><p>${bi('Configured campaign discovery is queued separately. New publications never replace this version.','설정된 캠페인 탐색은 별도로 대기합니다. 새 지식이 이 버전을 자동 변경하지 않습니다.')}</p>${btn(bi('View discovery task','탐색 작업 보기'),'campaignTask')}</div><div class="row">${btn(t('regenerate'),'regenerate',true)}${btn(bi('Curate shortlist','후보 목록 직접 편집'),'curate')}${btn(bi('Plan measurement','측정 계획 작성'),'measurement')}</div>`;}return heading(esc(briefDraft?.title||t('spring')),t('subtitle'),`<span class="tag">${bi('Internal planning','내부 계획')} · brief v${briefVersion}</span>${btn(bi('New campaign','새 캠페인'),'newCampaign')}`)+`<div class="tabs">${['brief','shortlist','history'].map(k=>`<button data-tab="${k}" class="${tab===k?'active':''}">${t(k)}</button>`).join('')}</div><div class="split"><section class="main-content">${body}</section>${evidenceInspector()}</div>`}
function assistant(){return heading(t('assistant'),bi('Ask what the shared evidence supports. Research scope stays in your hands.','공유 근거가 뒷받침하는 내용을 질문하세요. 추가 조사 범위는 직접 승인합니다.'))+`<div class="split"><section class="main-content"><div class="panel"><label for="question">${bi('Your question','질문')}</label><textarea id="question">${bi('Which recent Japanese cushion discussions can inform our launch brief?','최근 일본 쿠션 관련 대화 중 출시 브리프에 참고할 내용은 무엇인가요?')}</textarea><div class="row">${btn(t('ask'),'ask',true)}<span class="muted">${bi('Uses published knowledge','반영된 지식 사용')}</span></div></div><div class="panel"><h2>${bi('Supported findings','근거가 있는 내용')}</h2><p class="caption">「軽いつけ心地。春のベースメイクに。」</p><p>${bi('A literal cushion-family mention appears in this selected caption. It does not establish favorable sentiment or product efficacy.','선택한 캡션에 쿠션 제품군 언급이 있습니다. 긍정 감정이나 제품 효능을 의미하지 않습니다.')}</p><p><span class="tag">${bi('Extractive finding','원문 기반 결과')}</span>pub-17 / obs-21 · 2026-10-27</p><details><summary>${bi('Sources, actual inputs and limits','출처, 실제 입력 및 한계')}</summary><p>${bi('3 permitted support members from a bounded publication sample; 1 selected finding. Full actual input manifest q17 is pinned. No complete-market or independent fact-verification claim.','제한된 지식 표본에서 허용된 근거 3개 중 결과 1개 선택. 실제 전체 입력 목록 q17 고정. 전체 시장 커버리지나 독립 검증을 의미하지 않습니다.')}</p></details><hr><h3>${bi('Missing recent coverage','최근 근거 부족')}</h3><p>${bi('No permitted support after October 27. You can propose a bounded refresh, fill a missing attribute, or expand a topic.','10월 27일 이후 허용된 근거가 없습니다. 제한된 최신화, 누락 속성 보완 또는 주제 확장을 제안할 수 있습니다.')}</p><label for="intent">${bi('Research purpose','조사 목적')}</label><select id="intent"><option value="refresh">${bi('Refresh stale evidence','오래된 근거 최신화')}</option><option value="fill">${bi('Fill an unknown attribute','누락 속성 보완')}</option><option value="expansion">${bi('Expand brand or topic scope','브랜드 또는 주제 확장')}</option></select>${btn(t('proposal'),'proposal',true)}</div><details class="panel" open><summary>${bi('Research and synthesis workspace','리서치 및 종합 작업 공간')}</summary><h3 style="margin-top:18px">${bi('Supported synthesis','근거 기반 종합')}</h3><p>${bi('In the selected sample, cushion-family language appears alongside discussion of finish. The sample does not establish sales effect or audience location.','선택된 표본에서 쿠션 제품군 표현과 마무리감 논의가 함께 나타납니다. 표본은 매출 효과나 시청자 위치를 입증하지 않습니다.')}</p>${btn(bi('Inspect claim C1 and its support','주장 C1 및 근거 검토'),'claim')}<ol><li>${bi('Search existing published knowledge. No acquisition approval needed.','이미 반영된 지식 탐색. 외부 자료 취득 승인 불필요.')}</li><li>${bi('Compare claims and conflicting evidence. Unvalidated claims are withheld.','주장과 상충 근거 비교. 검증되지 않은 주장은 표시하지 않음.')}</li><li>${bi('Propose one exact missing-evidence task for review.','부족 근거 작업 하나의 정확한 범위 제안.')}</li></ol>${btn(bi('Review the proposed research step','제안 조사 단계 검토'),'proposal')}<p>${bi('A proposed plan would show steps, claims and source support. Each external acquisition still requires approval of an exact saved scope. Richer synthesis requires claim validation before release.','제안된 계획은 단계, 주장 및 근거를 표시합니다. 외부 자료 취득은 저장된 정확한 범위의 승인이 필요합니다. 풍부한 종합 답변은 출시 전 주장 검증이 필요합니다.')}</p><span class="tag">${t('future')}</span></details></section><aside class="inspector"><h3>${bi('Enrichment status','추가 조사 상태')}</h3><p id="proposalStatus">${bi('Proposal','제안')} v${proposalRevision} · ${localizedStatus(proposalState)}</p><p>${bi('Approval authorizes one exact proposal revision and at most one logical task. It does not override source access or spending limits.','승인은 정확한 제안 버전과 논리적 작업 하나만 허용합니다. 출처 접근이나 비용 한도를 우회하지 않습니다.')}</p>${proposalState!=='draft'?btn(bi('Open task','작업 열기'),'assistantTask'):''}<hr><p>${bi('When work is published, return here and ask again. This answer stays unchanged.','작업이 지식에 반영되면 돌아와 다시 질문하세요. 기존 답변은 변경되지 않습니다.')}</p></aside></div>`}
function localizedStatus(s){const pairs={draft:['Not submitted','미제출'],queued:['Queued','대기'],running:['Running','실행 중'],retrieved:['Retrieved, not yet usable','수집됨, 아직 사용 불가'],published:['Published and usable','지식 반영 완료'],partial:['Partially usable','일부 사용 가능'],waiting:['Waiting for safe recovery','안전 복구 대기'],failed:['Failed','실패']};return pairs[s]?bi(...pairs[s]):s}
const nodes=[{id:'account',label:'@mio.beauty',kind:'account',x:145,y:170},{id:'post1',label:'Cushion review · p1',kind:'content',x:350,y:120},{id:'post2',label:'Routine · p2',kind:'content',x:350,y:330},{id:'product',label:'Air cushion',kind:'product',x:560,y:190},{id:'brand',label:'Haneul',kind:'brand',x:645,y:350}];
const edges=[{id:'e1',from:'post1',to:'account',basis:'observed',label:'author_account'},{id:'e2',from:'post2',to:'account',basis:'observed',label:'author_account'},{id:'e3',from:'post1',to:'product',basis:'derived',label:'product_mention'},{id:'e4',from:'post2',to:'brand',basis:'derived',label:'brand_mention'},{id:'e5',from:'product',to:'brand',basis:'human',label:'catalog_brand'}];
function graph(){return heading(t('graph'),bi('Follow supported connections. Select a node or a relationship to inspect its basis.','근거가 있는 연결을 탐색하세요. 노드 또는 관계를 선택하여 근거를 검토하세요.'))+`<div class="toolbar"><div><label for="graphSearch">${bi('Find an entity','개체 검색')}</label><input id="graphSearch" placeholder="${bi('Account, brand, product or post','계정, 브랜드, 제품 또는 게시물')}" value="${esc(graphText)}"></div><div><label for="kind">${bi('Entity kind','개체 유형')}</label><select id="kind">${['all','account','content','brand','product'].map(k=>`<option ${k===graphKind?'selected':''} value="${k}">${({all:bi('All entities','모든 개체'),account:bi('Accounts','계정'),content:bi('Posts','게시물'),brand:bi('Brands','브랜드'),product:bi('Products','제품')})[k]}</option>`).join('')}</select></div><div><label for="basis">${bi('Relationship basis','관계 근거')}</label><select id="basis">${['all','observed','derived','human'].map(k=>`<option value="${k}" ${graphBasis===k?'selected':''}>${({all:bi('All bases','모든 근거'),observed:bi('Observed','관측'),derived:bi('Derived','추론'),human:bi('Human configured','사용자 설정')})[k]}</option>`).join('')}</select></div><div><label for="hop">${bi('Traversal depth','탐색 깊이')}</label><select id="hop">${[1,2,3].map(i=>`<option ${hop===i?'selected':''}>${i}</option>`).join('')}</select></div></div><p class="muted">${bi('TikTok · captured Oct 27–28 · bounded fixture sample · max 50 relationships / 100 nodes','TikTok · 10월 27~28일 수집 · 제한된 예시 표본 · 관계 최대 50개 / 노드 최대 100개')}</p><div class="split"><section class="main-content"><div class="graph"><div class="graph-tools">${btn('−','zoomOut')}${btn('+','zoomIn')}${btn(bi('Reset view','보기 초기화'),'resetGraph')}</div><svg id="graphSvg" viewBox="0 0 800 460" aria-label="${bi('Interactive knowledge graph','상호작용 지식 그래프')}"></svg><div class="legend"><span>${bi('Solid: observed','실선: 관측')}</span><span class="derived">${bi('Dashed: derived','파선: 추론')}</span><span class="human">${bi('Dotted: human','점선: 사용자')}</span></div></div><p id="graphCoverage" class="muted" aria-live="polite"></p><details class="panel"><summary>${bi('Entity list and relationship list','개체 및 관계 목록')}</summary><div class="compact-list" id="graphList"></div></details><div class="row">${btn(bi('Simulate source withdrawal','출처 철회 모의 실행'),'withdraw')}${btn(bi('Review selected evidence','선택한 근거 검토'),'graphEvidence')}</div></section><aside class="inspector" id="graphInspector" aria-live="polite"></aside></div>`}
function drawGraph(){if(!$('#graphSvg'))return;let all=nodes.filter(n=>!withdrawn||n.id!=='post1');let allowedEdges=edges.filter(e=>(!withdrawn||e.from!=='post1')&&(graphBasis==='all'||e.basis===graphBasis));let root=nodes.find(n=>n.id===selected)||nodes[1];let reached=new Set([root.id]);for(let i=0;i<hop;i++){const next=new Set(reached);for(const e of allowedEdges)if(reached.has(e.from)||reached.has(e.to)){next.add(e.from);next.add(e.to)}reached=next;}let shown=all.filter(n=>reached.has(n.id)&&(graphKind==='all'||n.kind===graphKind)&&(n.label.toLowerCase().includes(graphText.toLowerCase())));let ids=new Set(shown.map(n=>n.id));let shownEdges=allowedEdges.filter(e=>ids.has(e.from)&&ids.has(e.to));let svg=`<g transform="translate(${400-400*graphZoom} ${230-230*graphZoom}) scale(${graphZoom})">`;for(const e of shownEdges){let a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);svg+=`<g><line class="edge ${e.basis}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" data-edge="${e.id}" tabindex="0" role="button" aria-label="${e.label}, ${e.basis}"></line><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-10}" text-anchor="middle" style="font-size:10px">${e.label}</text></g>`;}for(const n of shown){svg+=`<g class="node" tabindex="0" role="button" aria-label="${esc(n.label)} ${n.kind}" data-node="${n.id}" transform="translate(${n.x} ${n.y})">${n.kind==='account'?'<circle class="shape" r="32"/>':n.kind==='content'?'<rect class="shape" x="-29" y="-23" width="58" height="46" rx="5"/>':'<path class="shape catalog" d="M0 -32 L35 0 L0 32 L-35 0Z"/>'}<text y="54" text-anchor="middle">${esc(n.label)}</text>${n.id===selected?'<circle r="43" fill="none" stroke="white" stroke-width="1"/>':''}</g>`;}$('#graphSvg').innerHTML=svg+'</g>';$('#graphCoverage').textContent=bi(`${shown.length} entities, ${shownEdges.length} relationships shown. Depth ${hop}. Partial sample, not complete market coverage.`,`${shown.length}개 개체, ${shownEdges.length}개 관계 표시. 깊이 ${hop}. 제한된 표본이며 전체 시장이 아닙니다.`);$('#graphList').innerHTML=shown.map(n=>btn(n.label,'node:'+n.id)).join('')+shownEdges.map(e=>btn(e.label+' · '+e.basis,'edge:'+e.id)).join('');inspectGraph();}
function inspectGraph(){const e=edges.find(e=>e.id===selected);const n=nodes.find(n=>n.id===selected);const unavailable=withdrawn&&(selected==='post1'||e?.from==='post1');$('#graphInspector').innerHTML=unavailable?`<h2>${bi('Unavailable under current policy','현재 정책상 사용 불가')}</h2><p>${bi('Source support was withdrawn. The historical selection remains, but its label, excerpts and dependent relationships are withheld.','출처 근거가 철회되었습니다. 과거 선택은 유지되지만 이름, 발췌문 및 연결 관계는 숨겨집니다.')}</p>`:`<span class="tag">${e?bi('Relationship','관계'):bi('Entity','개체')}</span><h2>${esc(e?.label||n?.label||'Selection')}</h2><p>${e?bi('Basis: '+e.basis, '근거: '+({observed:'관측',derived:'추론',human:'사용자 설정'})[e.basis]):bi('Kind: '+n?.kind,'유형: '+n?.kind)}</p>${e?`<p>${esc(e.from)} → ${esc(e.to)}</p>`:''}<p>${e?.basis==='human'?bi('Catalog association entered by Mina, catalog-v1. Conditional navigation context; not independently observed.','Mina가 등록한 catalog-v1 연결입니다. 탐색용 맥락이며 독립 관측 사실이 아닙니다.'):e?.basis==='derived'?bi('Provisional literal mention, span 7–12, lexicon-v1. A mention establishes no use, endorsement or efficacy.','잠정적인 문자상 언급, 구간 7~12, lexicon-v1. 사용, 보증 또는 효능을 의미하지 않습니다.'):bi('Observed support from a permitted source capture. Account identity does not establish a cross-platform Creator.','허용된 출처 수집의 관측 근거입니다. 계정은 여러 플랫폼의 동일 크리에이터를 의미하지 않습니다.')}</p><hr><h3>${t('source')}</h3><p class="caption">${selected==='brand'||e?.basis==='human'?bi('Human catalog configuration','사용자 카탈로그 설정'):'「軽いつけ心地。春のベースメイクに。」'}</p><p class="muted">obs-21 · derivation-d7 · pub-17<br>${bi('Published','게시')} 2026-10-25<br>${bi('Captured','수집')} 2026-10-27 09:00 UTC<br>${bi('Source as-of','소스 기준 시각')}: ${t('unknown')}<br>${bi('Knowledge publication','지식 반영')} 2026-10-28</p><p>${bi('Current policy: display/process/retain permitted. Conflicting assertions remain inspectable.','현재 정책: 표시, 처리, 보관 허용. 상충하는 주장도 검토 가능합니다.')}</p><details><summary>${bi('Conflicting values and limitations','상충 값 및 한계')}</summary><p>${bi('Observed display name “Mio” differs from another capture “Mio beauty”. Neither establishes identity equivalence. The sample is bounded.','관측 이름 “Mio”와 다른 수집의 “Mio beauty”가 다릅니다. 동일 인물의 증거가 아닙니다. 표본 범위는 제한됩니다.')}</p></details>${btn(bi('Traverse from this entity','이 개체에서 탐색'),'traverse')}`;}
function monitoringSummary(){const defs={volume:{values:['24','8','3×'],labels:[bi('recent posts','최근 게시물'),bi('baseline posts','기준 게시물'),bi('sampled volume ratio','표본 게시량 비율')],title:bi('More cushion mentions in this collection window','이번 수집 구간에 쿠션 언급 증가'),detail:bi('24 vs 8 distinct eligible posts. Same query, route and 60-minute window. Fixture rule: ratio ≥2 and baseline ≥5.','선정 가능한 고유 게시물 24개와 8개 비교. 동일 검색어, 경로 및 60분 구간. 예시 규칙: 비율 2 이상, 기준 5개 이상.'),method:'volume-ratio-fixture-v1'},engagement:{values:['36','12','3×'],labels:[bi('recent median likes','최근 좋아요 중앙값'),bi('baseline median likes','기준 좋아요 중앙값'),bi('matched-age ratio','동일 게시 시점 비율')],title:bi('Likes increased for a comparable post sample','비교 가능한 게시물 표본에서 좋아요 증가'),detail:bi('24 recent vs 24 baseline posts. Native X like_count measured 6 hours after publication in both samples. Fixture rule: median ratio ≥2 with ≥20 measured posts per sample. Views, replies and missing metrics are not added to likes.','최근 및 기준 표본 각 24개. 두 표본 모두 게시 6시간 후 X like_count 측정. 예시 규칙: 각 표본 측정 게시물 20개 이상 및 중앙값 비율 2 이상. 조회, 답글 및 미상 지표를 좋아요에 더하지 않습니다.'),method:'matched-age-likes-fixture-v1'},semantic_shift:{values:['35%','10%','+25 pp'],labels:[bi('recent coded negative','최근 부정 분류'),bi('baseline coded negative','기준 부정 분류'),bi('sample proportion change','표본 비율 변화')],title:bi('More negative-coded finish comments in this sample','이 표본에서 부정적으로 분류된 마무리감 언급 증가'),detail:bi('7 of 20 recent inputs vs 2 of 20 baseline inputs. Same product scope, coding method and language mix. Fixture threshold: +20 percentage points. Positions remain provisional; sarcasm and packaging ambiguity remain reviewable. This is not population sentiment.','최근 입력 20개 중 7개와 기준 입력 20개 중 2개 비교. 동일 제품 범위, 분류 방법 및 언어 구성. 예시 기준: 20%p 이상 증가. 입장 분류는 잠정적이며 반어 및 용기 표현의 모호성을 검토할 수 있습니다. 전체 인구의 감정이 아닙니다.'),method:'coded-position-shift-fixture-v1'},controversy:{values:['4','12','Provisional'],labels:[bi('selected inputs','선택 입력'),bi('actual sample inputs','실제 표본 입력'),bi('meaning assessment','의미 평가')],title:bi('Possible emerging quality controversy','새로운 품질 논쟁 가능성'),detail:bi('Four inputs discuss cracking. Review the original wording and whether it refers to packaging or finish. No adequate semantic baseline means no claim of change over time.','입력 4개에서 갈라짐 언급. 용기인지 마무리감인지 원문 표현을 검토하세요. 적절한 의미 기준 구간 없이는 시간에 따른 변화를 주장하지 않습니다.'),method:'quality-controversy-fixture-v1'}};const d=defs[monitoringMethod];if(baselineQuality!=='comparable')return `<div class="notice"><h2>${bi('No assessable signal','평가 가능한 신호 없음')}</h2><p>${baselineQuality==='missing'?bi('The baseline is missing or not comparable. Show the recent evidence as a snapshot; do not call it a spike or shift.','기준 구간이 없거나 비교할 수 없습니다. 최근 근거를 스냅샷으로 표시하며 급증이나 변화로 해석하지 않습니다.'):bi('Method validation failed. Keep source evidence inspectable, withhold the generated signal, and request method review. This failure does not authorize external research.','방법 검증 실패. 출처 근거는 검토할 수 있지만 생성 신호는 숨기고 방법 검토를 요청합니다. 이 실패는 외부 조사를 승인하지 않습니다.')}</p>${btn(t('timeline'),'timeline')}</div>`;return `<div class="metric-strip">${d.values.map((v,i)=>`<div><strong>${v==='Provisional'?bi('Provisional','잠정적'):v}</strong>${d.labels[i]}</div>`).join('')}</div><div class="panel"><h2>${d.title}</h2><p>${bi('Recent: Nov 3, 02:00–03:00 UTC. Baseline: Nov 2, 02:00–03:00 UTC.','최근: 11월 3일 02:00~03:00 UTC. 기준: 11월 2일 02:00~03:00 UTC.')}</p><p>${d.detail}</p><p class="muted">${d.method} · ${bi('Partial sampled conversation; no causal or complete-market claim.','불완전한 대화 표본. 인과 또는 전체 시장을 의미하지 않습니다.')}</p><div class="row">${btn(t('context'),'context',true)}${btn(t('timeline'),'timeline')}${btn(bi('Inspect method and evidence','방법 및 근거 검토'),'methodEvidence')}</div></div>`;}
function monitoring(){return heading(t('monitoring'),bi('Understand sampled conversation independently of campaign planning.','캠페인 계획과 별개로 수집 표본의 대화를 파악하세요.'),btn(bi('Configure topic','주제 설정'),'topic'))+`<div class="tabs"><button class="active">${bi('Air cushion discussion','에어 쿠션 대화')}</button><button data-action="snapshot">${bi('Snapshot investigation','스냅샷 조사')}</button></div><div class="split"><section class="main-content"><label for="monitorMethod">${bi('Alert method','알림 방법')}</label><select id="monitorMethod">${['volume','engagement','semantic_shift','controversy'].map(k=>`<option value="${k}" ${monitoringMethod===k?'selected':''}>${({volume:bi('Post volume','게시량'),engagement:bi('Engagement spike','참여도 급증'),semantic_shift:bi('Sentiment or semantic shift','감정 또는 의미 변화'),controversy:bi('Emerging controversy','새로운 논쟁')})[k]}</option>`).join('')}</select><label for="baselineQuality">${bi('Comparison support','비교 근거')}</label><select id="baselineQuality"><option value="comparable" ${baselineQuality==='comparable'?'selected':''}>${bi('Comparable baseline','비교 가능한 기준 구간')}</option><option value="missing" ${baselineQuality==='missing'?'selected':''}>${bi('Insufficient baseline','불충분한 기준 구간')}</option><option value="invalid" ${baselineQuality==='invalid'?'selected':''}>${bi('Method validation failed','방법 검증 실패')}</option></select><div class="row" style="margin-top:18px"><span class="status">${topicPaused?bi('Paused','일시 중지'):bi('Recurring topic','반복 모니터링 주제')}</span><span class="tag">X · ${bi('sampled conversation','대화 표본')}</span></div>${monitoringSummary()}<div class="columns"><div class="panel"><span class="tag">${bi('Provisional semantic signal','잠정 의미 신호')}</span><h3>${bi('Possible quality controversy','품질 논쟁 가능성')}</h3><p>${bi('4 of 12 reviewed sample inputs discuss cracking. Meaning is provisional, not verified sentiment.','검토 표본 입력 12개 중 4개에서 갈라짐 언급. 잠정적 해석이며 검증된 감정이 아닙니다.')}</p>${btn(bi('Inspect semantic evidence','의미 신호 근거 보기'),'semantic')}</div><div class="panel"><h3>${bi('Other checks','다른 점검')}</h3><p>${bi('Engagement spike compares the same native metric at matched post age. Select the method above to inspect the success case or insufficient baseline.','참여도 급증은 동일 게시 후 시점의 같은 소스 지표를 비교합니다. 위 방법 선택에서 정상 사례 또는 기준 부족 상태를 확인하세요.')}</p><p>${bi('Semantic shift keeps coded positions, denominators and original-language uncertainty explicit. Method failure withholds the signal.','의미 변화는 분류된 입장, 분모 및 원문 언어 불확실성을 명시합니다. 방법 실패 시 신호를 표시하지 않습니다.')}</p></div></div>${alertContext?`<div class="notice"><h3>${bi('Saved alert investigation','저장된 알림 조사')}</h3><p>${bi('Recent alert evidence is compared with pub-17, captured Oct 27. Similar product language supplies context, not a cause. No external acquisition or campaign creation occurred.','최근 알림 근거를 10월 27일 수집된 pub-17과 비교했습니다. 비슷한 제품 표현은 맥락이며 원인이 아닙니다. 외부 수집이나 캠페인 생성은 없었습니다.')}</p><span class="tag">context-v1</span></div>`:''}<div class="panel"><h3>${bi('Select observations to retain in shared knowledge','공유 지식으로 반영할 관측 선택')}</h3><label><input type="checkbox" id="promoteCheck" style="width:auto"> ${bi('Observation recent-21 · post about cushion texture','관측 recent-21 · 쿠션 질감 관련 게시물')}</label><p class="muted">${bi('Promotion inherits source rights and original retention deadline. It grants no creator/product association.','원래 출처 권한과 보관 기한을 승계합니다. 크리에이터 또는 제품 연결을 새로 부여하지 않습니다.')}</p>${btn(t('promote'),'promote')} ${promoted?`<span class="status">${bi('Published · pub-18','지식 반영됨 · pub-18')}</span>`:''}</div></section><aside class="inspector"><h3>${bi('Topic bounds','주제 범위')}</h3><p>"Air cushion"<br>${bi('Every 60 min · 60 min windows','60분마다 · 60분 구간')}<br>${bi('100 records/window · 24 h retention','구간당 100개 · 24시간 보관')}</p><p>${bi('Illustrative operator settings, not product defaults. Topic activation and source permission are separate.','운영자 설정 예시이며 제품 기본값이 아닙니다. 주제 활성화와 출처 권한은 별개입니다.')}</p>${btn(topicPaused?bi('Review activation','활성화 검토'):bi('Pause topic','주제 일시 중지'),'pauseTopic')} function pipeline(){return heading(t('pipeline'),bi('Follow work from its original authority to currently usable knowledge.','최초 실행 권한부터 현재 사용 가능한 지식까지 확인하세요.'))+`<div class="split"><section class="main-content"><div class="panel"><div class="row"><h2>Task ${proposalState==='draft'?'campaign-12':'research-31'}</h2><span class="status">${localizedStatus(taskState)}</span></div><p>${bi('Origin','시작 근거')}: ${proposalState==='draft'?bi('campaign coverage · configured authority','캠페인 근거 보완 · 설정된 권한'):bi('assistant proposal v'+approvedRevision+' · approved by Mina','어시스턴트 제안 v'+approvedRevision+' · Mina 승인')}</p><div class="timeline"><article><h3>${bi('Accepted · exact scope retained','접수 · 정확한 범위 유지')}</h3><p>${bi('Purpose, subject, limits and actor pinned to original request.','목적, 대상, 한도 및 실행자 원래 요청에 고정.')}</p></article><article><h3>${bi('Acquisition · attempt 1','수집 · 시도 1')}</h3><p>${['retrieved','published'].includes(taskState)?bi('12 records retrieved · 9 unique · 2 known refreshes · 1 excluded.','12개 수집 · 고유 9개 · 기존 자료 최신화 2개 · 제외 1개.'):bi('Acquisition not yet confirmed.','자료 취득이 아직 확인되지 않았습니다.')}</p></article><article><h3>${bi('Transform & ingest · run-44','변환 및 적재 · run-44')}</h3><p>${['retrieved','published'].includes(taskState)?'obs-21 → mapper-v1 → derivation-d7':bi('No committed support yet.','아직 확정된 근거가 없습니다.')}</p></article><article><h3>${taskState==='published'?bi('Knowledge publication · pub-17','지식 반영 · pub-17'):bi('Knowledge publication · pending','지식 반영 · 대기')}</h3><p>${bi('Only permitted supported members become queryable. Retrieved material can remain unpublished.','허용된 근거만 질의에 사용됩니다. 수집 자료가 지식에 반영되지 않을 수도 있습니다.')}</p></article></div><div class="row">${btn(bi('Simulate next phase','다음 단계 모의 실행'),'advanceTask')}${btn(bi('Simulate unknown response','응답 불명 모의 실행'),'unknownResponse')}${btn(bi('Inspect safe recovery','안전 복구 검토'),'recovery')}</div></div><div class="row"><h2>${bi('Processing decisions','처리 판단')}</h2>${btn(bi('Review progressive plan','점진 수
