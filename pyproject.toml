[project]
name = "smi-ingestion"
version = "0.1.0"
description = "Local, source-independent social evidence ingestion"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
smi-ingest = "smi_ingestion.cli:main"
smi-review = "smi_review.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smi_ingestion", "src/smi_knowledge", "src/smi_campaigns", "src/smi_monitoring", "src/smi_review", "src/smi_tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
