services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smi
      POSTGRES_USER: smi
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:6543:5432"
    volumes:
      - smi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smi -d smi"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  smi_postgres_data:
